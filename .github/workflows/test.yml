name: Run Unit Tests

on:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.0' 

    - name: Create and activate virtual environment
      run: |
        python -m venv venv  # Create virtual environment
        source venv/bin/activate  # Activate virtual environment
        python -m pip install --upgrade pip  # Upgrade pip
        # requirements.txt is UTF-16 encoded; normalize to UTF-8 first.
        iconv -f UTF-16 -t UTF-8 requirements.txt > requirements-utf8.txt
        pip install -r requirements-utf8.txt  # Install dependencies from requirements.txt
        pip install pytest

    - name: Run unit tests and print per-site report
      run: |
        source venv/bin/activate
        python run_tests.py
          
    - name: Upload test results artifact
      uses: actions/upload-artifact@v4
      with:
          name: pytest-results
          path: test-results.xml

    - name: Annotate test failures in GitHub UI
      if: failure()  # Only run if tests fail
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: "test-results.xml"