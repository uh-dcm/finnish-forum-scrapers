name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is UTF-16 encoded; normalize to UTF-8 first.
          iconv -f UTF-16 -t UTF-8 requirements.txt > requirements-utf8.txt
          pip install -r requirements-utf8.txt
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean Finnish-Forum-Scraper-onefile.spec

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_id }}
          name: Finnish Forum Scraper ci-${{ github.run_id }}
          files: |
            dist/FinnishForumScraper.exe
          generate_release_notes: true
